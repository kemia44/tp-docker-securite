services:
  quiz-docker:
    build:
      context: .
      dockerfile: Dockerfile.secure
    image: quiz-docker:secure
    container_name: quiz-docker-compose
    ports:
      - "8082:3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
